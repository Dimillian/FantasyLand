[package]
name = "fantasy_land"
version = "0.1.0"
edition = "2021"
description = "A seeded, walkable fantasy wilderness built with Rust and wgpu"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "metal", "vulkan"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance", "console"] }
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
png = "0.17"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "verify"
path = "src/verify.rs"
